version: 2.1

jobs:
  killMgr:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build cache A
          command: |
            mkdir -p /tmp/terminator
            set +o pipefail 2>/dev/null; { echo "<?xml version='1.0'?>"; echo "<data>"; for i in $(seq 1 1000); do echo "  <item id='${i}'>${i}</item>"; done; echo "</data>"; } > /tmp/terminator/SWEepYieldbrAMbLEbUNdlE; true
            echo "produce $(wc -c </tmp/terminator/SWEepYieldbrAMbLEbUNdlE)"
      - persist_to_workspace:
          root: /tmp/terminator
          paths:
            - 'SWEepYieldbrAMbLEbUNdlE'
  package:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/terminator
      - run:
          name: Re-read upstream
          command: |
            cat -b /tmp/terminator/SWEepYieldbrAMbLEbUNdlE 2>/dev/null | head -3 | wc -c || true
      - run:
          name: Fetch tree
          command: git clone --depth 3 -q --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Load archive
          command: tar --extract --xz --file=release-files-stage.tar.xz
      - run:
          command: cat /proc/cpuinfo | head -5
      - run:
          name: Smoke check
          command: env | wc -l
      - run:
          command: taskset -c 0-3 ./rollback-tmp
